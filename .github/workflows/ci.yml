name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordex-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    # This is a public repository on self-hosted runners, so a pull request
    # from a fork must never reach them. Same-repository events only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify runtime pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version).Trim() -ne 'v24.19.0') { throw 'Unexpected Node.js version' }

      - name: Install locked root dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=low

      - name: Build the documentation site
        run: npm run build

      # IMPLEMENTATION-HANDOFF [OX-R03] Executed coverage and browser release evidence; ANNOTATED.
      # Current: a clean build, 243 verifier tests and 34 platform tests pass even
      # when deployed ConformanceStudio/ProtocolLab hydration fails and Gateway
      # Doctor returns 8/8 success for an unreachable endpoint. Presence/source
      # assertions and mock API tests do not prove the advertised journeys.
      # Sources: tests/targeted-results.json, evidence/browser screenshots/logs,
      # reports/site.md and reports/coverage-matrix.json in the handoff.
      # Prerequisites: OX-S03 evidence/context; OX-S07 browser runtime; OX-S02
      # real gateway checks; OX-P07 MCP; all product-specific repair packages.
      # 1. Add real built-site browser tests that fail on page/console errors,
      # unhandled rejections, false-success checks and inactive visible controls.
      # Cover mobile/desktop, keyboard, empty/error/loading/retry, SDK kit install,
      # actual event replay and MCP tools with isolated deterministic services.
      # 2. Keep local/component evidence separate from genuine Signet or justified
      # Testnet wallet/node/indexer acceptance. Each independent operation needs
      # exact source/artifact/network identity and authoritative outcome evidence.
      # 3. Build a machine-checkable immutable Ordex coverage receipt. Missing,
      # disabled, blocked or untested offered features remain required NO-GO rows.
      # 4. Publish docs/site, worker and SDK only at the accepted contract SHA;
      # verify deployed identity and use the receipt in Core OX-R02 publication.
      # Verify: existing npm run build/test/conformance and SDK checks stay green;
      # browser tests must reproduce current hydration/false-PASS defects first.
      # Acceptance: every required row PASS; actual public release is separate
      # evidence. Preserve self-hosted runners and the fork-PR isolation rule.
      # Rollback: coordinated previous site/worker/SDK artifacts with compatible
      # persistence; retain user journeys and evidence without fabricating PASS.
      # END IMPLEMENTATION-HANDOFF [OX-R03]
      - name: Run the reference verifiers and unit tests
        run: npm test

      - name: Run the conformance CLI runner
        run: npm run conformance

      # Browser gates (OX-S07, OX-S10): serve the built site under /ordex and drive it with
      # Playwright Chromium. They fail on hydration errors, console errors and false results.
      - name: Install the pinned Chromium for the browser gates
        run: npx playwright install chromium

      - name: Run the built-site browser gates
        run: npm run test:browser

      # dist/ is a build output and stays untracked. The build itself fails
      # loudly on an error, so the check here is that everything the deploy
      # needs actually came out of it.
      - name: Prove the build produced the site and the worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in 'dist/client/index.html', 'dist/client/api-reference.html', 'dist/server/index.js', 'dist/client/lab/index.html', 'dist/client/verify/index.html', 'dist/client/atlas/index.html', 'dist/client/kits/index.html', 'dist/client/ask/index.html', 'dist/client/pagefind/pagefind.js') {
            if (-not (Test-Path $file)) { throw "$file missing from the build output" }
          }

      # GitHub Pages serves docs/ from main, so the generated reference and the
      # published copies of the manifest and llms.txt live there as committed
      # files. The build regenerates them; any difference means someone edited
      # an output by hand or forgot to rebuild.
      - name: Prove the committed generated files match their sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- docs/api-reference.html docs/docs.manifest.json docs/llms.txt
          if ($LASTEXITCODE -ne 0) { throw 'a committed file under docs/ no longer matches its source' }

      - name: Install locked SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Audit SDK dependencies
        working-directory: sdk
        run: npm audit --audit-level=low

      - name: Regenerate SDK types from the contract
        working-directory: sdk
        run: npm run generate

      - name: Prove the committed SDK types match the contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code -- sdk/src/schema.ts
          if ($LASTEXITCODE -ne 0) { throw 'sdk/src/schema.ts no longer matches the contract' }

      - name: Build the SDK
        working-directory: sdk
        run: npm run build

      - name: Test the SDK
        working-directory: sdk
        run: npm test
